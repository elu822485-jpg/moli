<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>茉莉人设小助手 · CHARACTER BUILD PROTOCOL</title>
<style>
  :root{
    --bg:#f7f7f8;
    --panel:#ffffff;
    --panel-2:#fbfbfc;
    --ink:#0d0d0d;
    --ink-2:#5a5a5a;
    --ink-3:#9c9c9c;
    --ink-4:#c9c9c9;
    --line:#ececec;
    --line-2:#dcdcdc;
    --radius:12px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Pretendard","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",
                "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    position:sticky;top:0;z-index:60;
    background:rgba(247,247,248,.82);
    backdrop-filter:saturate(180%) blur(16px);
    -webkit-backdrop-filter:saturate(180%) blur(16px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1160px;margin:0 auto;padding:16px 28px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .mark{width:10px;height:10px;border-radius:50%;background:var(--ink);flex:0 0 auto;}
  .brand h1{font-size:15px;font-weight:700;margin:0;letter-spacing:-.01em;}
  .brand p{margin:0;font-size:9.5px;letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase;font-weight:600;}
  .status{
    display:flex;align-items:center;gap:8px;
    font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-3);font-weight:700;white-space:nowrap;
  }
  .status-dot{width:6px;height:6px;border-radius:50%;background:#d4d4d4;transition:background .2s;}
  .status-dot.ok{background:var(--ink);}
  .status-dot.loading{background:var(--ink);animation:pulse 1s infinite;}
  .status-dot.err{background:var(--ink);box-shadow:0 0 0 3px #e2e2e2;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

  .wrap{max-width:1160px;margin:0 auto;padding:28px 28px 100px;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px;
    margin-bottom:16px;
  }
  .card-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:20px;flex-wrap:wrap;
  }
  .card-head h2{
    font-size:11px;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;margin:0;color:var(--ink);
  }
  .hint{font-size:11px;color:var(--ink-3);letter-spacing:.02em;}
  .head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

  .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .tab{
    background:transparent;border:none;cursor:pointer;
    font:inherit;font-size:12.5px;font-weight:600;
    color:var(--ink-3);
    padding:10px 4px;margin-right:24px;
    position:relative;
    display:inline-flex;align-items:center;gap:7px;
    transition:color .15s;
  }
  .tab:hover{color:var(--ink-2);}
  .tab.active{color:var(--ink);}
  .tab.active::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;
    height:2px;background:var(--ink);border-radius:2px 2px 0 0;
  }
  .badge{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:18px;height:18px;padding:0 6px;
    background:var(--ink);color:#fff;
    border-radius:9px;font-size:10px;font-weight:700;
  }
  .badge:empty{display:none;}

  .row-3{display:grid;grid-template-columns:1.1fr 1.1fr 1.5fr;gap:14px;}
  .row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px;}
  @media(max-width:900px){.row-3,.row-4{grid-template-columns:1fr;}}

  .field{display:flex;flex-direction:column;gap:7px;min-width:0;}
  .field > span{
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);font-weight:700;
  }
  input,select,textarea{
    width:100%;
    background:#fff;
    border:1px solid var(--line-2);
    border-radius:var(--radius-sm);
    padding:10px 13px;
    font:inherit;font-size:13px;color:var(--ink);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus,select:focus,textarea:focus{
    border-color:var(--ink);
    box-shadow:0 0 0 3px rgba(13,13,13,.05);
  }
  input::placeholder,textarea::placeholder{color:#bdbdbd;}
  select{appearance:none;cursor:pointer;padding-right:34px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%239c9c9c' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 13px center;
  }
  .inline{display:flex;gap:8px;align-items:stretch;}
  .inline select{flex:1;min-width:0;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    height:38px;padding:0 16px;border-radius:var(--radius-sm);
    border:1px solid transparent;
    font:inherit;font-size:12.5px;font-weight:600;letter-spacing:.01em;
    cursor:pointer;white-space:nowrap;
    transition:background .16s ease,border-color .16s ease,color .16s ease,opacity .16s;
  }
  .btn-dark{background:var(--ink);color:#fff;}
  .btn-dark:hover:not(:disabled){background:#2a2a2a;}
  .btn-dark:disabled{background:#dcdcdc;color:#fff;cursor:not-allowed;}
  .btn-ghost{background:#fff;border-color:var(--line-2);color:var(--ink);}
  .btn-ghost:hover:not(:disabled){border-color:var(--ink);}
  .btn-ghost:disabled{color:#c9c9c9;cursor:not-allowed;}
  .btn-sm{height:32px;padding:0 12px;font-size:11.5px;border-radius:8px;}

  .mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media(max-width:900px){.mode-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:520px){.mode-grid{grid-template-columns:1fr;}}
  .mode-card{
    text-align:left;
    padding:16px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    cursor:pointer;
    font:inherit;
    display:flex;flex-direction:column;gap:5px;
    transition:border-color .16s, background .16s;
  }
  .mode-card:hover{border-color:var(--ink-3);}
  .mode-card.active{border-color:var(--ink);background:var(--panel-2);}
  .mode-num{font-size:9.5px;letter-spacing:.22em;color:var(--ink-3);font-weight:700;}
  .mode-card.active .mode-num{color:var(--ink-2);}
  .mode-title{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:-.01em;}
  .mode-desc{font-size:11px;color:var(--ink-3);line-height:1.55;margin-top:2px;}
  .mode-len{
    font-size:10px;color:var(--ink-3);font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;margin-top:6px;
  }
  .mode-card.active .mode-len{color:var(--ink-2);}

  .cfg-group{margin-bottom:20px;}
  .cfg-group:last-child{margin-bottom:0;}
  .cfg-label{
    display:block;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);font-weight:700;margin-bottom:10px;
  }
  .seg{display:inline-flex;background:#f2f2f3;border-radius:10px;padding:3px;gap:2px;}
  .seg-item{
    border:none;background:transparent;
    padding:8px 18px;border-radius:8px;
    font:inherit;font-size:12.5px;font-weight:500;
    color:var(--ink-2);cursor:pointer;
    transition:all .15s;
  }
  .seg-item:hover{color:var(--ink);}
  .seg-item.active{
    background:#fff;color:var(--ink);font-weight:600;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }

  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 15px;
    border:1px solid var(--line-2);
    border-radius:999px;
    font-size:12.5px;color:var(--ink-2);
    cursor:pointer;user-select:none;
    transition:all .15s;
    background:#fff;
  }
  .chip:hover{border-color:var(--ink-3);}
  .chip input{width:14px;height:14px;padding:0;margin:0;accent-color:#0d0d0d;cursor:pointer;flex:0 0 auto;}
  .chip:has(input:checked){border-color:var(--ink);background:var(--ink);color:#fff;}

  .info-bar{
    display:flex;align-items:center;gap:10px;
    margin-top:14px;padding:11px 15px;
    border:1px dashed var(--line-2);
    border-radius:10px;
    font-size:11.5px;color:var(--ink-2);
    background:#fbfbfc;
  }
  .info-bar strong{font-weight:700;color:var(--ink);}
  .info-bar .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-4);flex:0 0 auto;}

  .ta{resize:vertical;line-height:1.75;}
  .ta-lg{min-height:190px;}
  .ta-sys{
    min-height:180px;font-size:11.5px;line-height:1.7;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    background:#fafafa;color:#3a3a3a;
  }

  .workspace{
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:16px;align-items:start;
  }
  @media(max-width:980px){.workspace{grid-template-columns:1fr;}}

  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}

  .output{
    margin-top:4px;
    min-height:520px;
    max-height:72vh;
    overflow-y:auto;
    white-space:pre-wrap;
    word-break:break-word;
    font-size:13.5px;line-height:2;
    color:#1c1c1c;
    padding-right:8px;
  }
  .output::-webkit-scrollbar{width:6px;}
  .output::-webkit-scrollbar-track{background:transparent;}
  .output::-webkit-scrollbar-thumb{background:#dcdcdc;border-radius:3px;}
  .output::-webkit-scrollbar-thumb:hover{background:#bfbfbf;}
  .placeholder{color:#c0c0c0;}

  .meta-line{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:10px;padding-top:10px;
    border-top:1px dashed var(--line);
    font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);
    font-weight:600;text-transform:uppercase;
  }
  .meta-line .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-4);}

  .trash-list{display:flex;flex-direction:column;gap:12px;}
  .trash-empty{text-align:center;padding:60px 20px;color:var(--ink-4);font-size:12.5px;letter-spacing:.06em;}
  .trash-item{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    background:var(--panel-2);
    transition:border-color .15s;
  }
  .trash-item:hover{border-color:var(--line-2);}
  .trash-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;}
  .trash-info{min-width:0;flex:1;}
  .trash-meta{
    display:flex;align-items:center;gap:9px;margin-bottom:6px;
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-3);font-weight:700;
  }
  .trash-mode{background:#f2f2f3;color:var(--ink-2);padding:2px 8px;border-radius:5px;letter-spacing:.06em;}
  .trash-dot{width:3px;height:3px;border-radius:50%;background:var(--ink-4);}
  .trash-title{
    font-size:13.5px;font-weight:600;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .trash-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .trash-body{
    margin-top:14px;padding-top:14px;
    border-top:1px dashed var(--line-2);
    font-size:12.5px;line-height:1.95;color:var(--ink-2);
    white-space:pre-wrap;word-break:break-word;
    max-height:440px;overflow-y:auto;
    padding-right:6px;
  }
  .trash-body::-webkit-scrollbar{width:5px;}
  .trash-body::-webkit-scrollbar-thumb{background:#dcdcdc;border-radius:3px;}

  .toasts{
    position:fixed;top:18px;right:18px;z-index:999;
    display:flex;flex-direction:column;gap:8px;pointer-events:none;
  }
  .toast{
    background:var(--ink);color:#fff;
    padding:11px 17px;border-radius:10px;
    font-size:12.5px;font-weight:500;line-height:1.5;
    max-width:340px;
    box-shadow:0 8px 26px rgba(0,0,0,.16);
    transition:opacity .22s ease, transform .22s ease;
    animation:slideIn .22s ease;
  }
  .toast.err{background:#fff;color:var(--ink);border:1px solid var(--ink);}
  @keyframes slideIn{from{opacity:0;transform:translateX(12px);}to{opacity:1;transform:none;}}

  .footer{
    text-align:center;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:#c2c2c2;font-weight:700;
    padding:8px 0 40px;
  }
</style>
</head>
<body>

<div class="toasts" id="toasts"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="mark"></span>
      <div>
        <h1>茉莉人设小助手</h1>
        <p>Character Build Protocol</p>
      </div>
    </div>
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">未连接</span>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- API 配置 -->
  <section class="card">
    <div class="card-head">
      <h2>API 配置</h2>
      <span class="hint">密钥仅保存在本机浏览器</span>
    </div>

    <div class="row-3">
      <label class="field">
        <span>Base URL</span>
        <input id="baseUrl" type="text" placeholder="https://api.openai.com/v1" autocomplete="off" spellcheck="false">
      </label>

      <label class="field">
        <span>API Key</span>
        <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
      </label>

      <div class="field">
        <span>Model</span>
        <div class="inline">
          <select id="modelSelect">
            <option value="">— 请先拉取模型 —</option>
          </select>
          <button class="btn btn-dark" id="btnFetchModels">拉取模型</button>
        </div>
      </div>
    </div>

    <div class="row-4">
      <label class="field">
        <span>Temperature</span>
        <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.9">
      </label>
      <label class="field">
        <span>Max Tokens</span>
        <input id="maxTokens" type="number" min="512" max="64000" step="512" value="8192">
      </label>
      <label class="field">
        <span>流式输出</span>
        <select id="streamChk">
          <option value="1" selected>开启</option>
          <option value="0">关闭</option>
        </select>
      </label>
      <div class="field" style="justify-content:flex-end;">
        <button class="btn btn-ghost" id="btnClearCfg">清除本地配置</button>
      </div>
    </div>
  </section>

  <!-- Tabs -->
  <nav class="tabs">
    <button class="tab active" data-tab="work">工作台</button>
    <button class="tab" data-tab="trash">
      回收站 <span class="badge" id="trashBadge"></span>
    </button>
  </nav>

  <!-- 工作台 -->
  <div class="panel" id="panelWork">

    <section class="card">
      <div class="card-head">
        <h2>生成模式</h2>
        <span class="hint">选择本次生成侧重方向</span>
      </div>

      <div class="mode-grid" id="modeGrid">
        <button class="mode-card active" data-mode="full">
          <span class="mode-num">01</span>
          <span class="mode-title">完整人设卡</span>
          <span class="mode-desc">按标准协议输出全部章节</span>
          <span class="mode-len">≥ 8000 字</span>
        </button>
        <button class="mode-card" data-mode="backstory">
          <span class="mode-num">02</span>
          <span class="mode-title">深挖背景故事</span>
          <span class="mode-desc">聚焦经历、时间线与因果链</span>
          <span class="mode-len">≥ 5000 字</span>
        </button>
        <button class="mode-card" data-mode="roleplay">
          <span class="mode-num">03</span>
          <span class="mode-title">优化扮演 / OOC</span>
          <span class="mode-desc">聚焦行为一致性与反模板</span>
          <span class="mode-len">≥ 5000 字</span>
        </button>
        <button class="mode-card" data-mode="relation">
          <span class="mode-num">04</span>
          <span class="mode-title">深挖关系情感</span>
          <span class="mode-desc">聚焦人际网络与亲密机制</span>
          <span class="mode-len">≥ 6000 字</span>
        </button>
      </div>

      <div class="info-bar">
        <strong>强制完整输出协议已内置</strong>
        <span class="dot"></span>
        <span>禁止跳过任何章节，禁止使用占位语，每个字段必须具体</span>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>指令配置</h2>
        <span class="hint">决定本次使用的系统指令</span>
      </div>

      <div class="cfg-group">
        <span class="cfg-label">系统指令源</span>
        <div class="seg" id="sourceSeg">
          <button class="seg-item active" data-src="builtin">茉莉内置协议</button>
          <button class="seg-item" data-src="custom">自定义预设</button>
          <button class="seg-item" data-src="none">不使用</button>
        </div>
      </div>

      <div class="cfg-group" id="customPresetWrap" hidden>
        <span class="cfg-label">自定义预设内容</span>
        <textarea id="customPreset" class="ta ta-sys"
          placeholder="在此写入你的自定义系统指令，例如另一个角色构建协议、特殊的语气规则、世界观约束……"></textarea>
      </div>

      <div class="cfg-group">
        <span class="cfg-label">附加预设</span>
        <div class="chips">
          <label class="chip">
            <input type="checkbox" id="chkStyle" checked>
            <span>文风塑造指令</span>
          </label>
          <label class="chip">
            <input type="checkbox" id="chkWb" checked>
            <span>世界书 · 扮演规范 + 好感度</span>
          </label>
        </div>
      </div>
    </section>

    <div class="workspace">
      <section class="card">
        <div class="card-head">
          <h2>角色描述</h2>
          <span class="hint">描述你想要的角色</span>
        </div>

        <textarea id="userInput" class="ta ta-lg"
          placeholder="例：帮我塑造一个 29 岁的独立音乐人女性角色，住在首尔望远洞，白天在唱片店打工，晚上写歌。性格冷淡但不刻薄，有轻微的社交回避……"></textarea>

        <div class="actions">
          <button class="btn btn-dark" id="btnGenerate">生成人设</button>
          <button class="btn btn-ghost" id="btnContinue" disabled>继续生成</button>
          <button class="btn btn-ghost" id="btnStop" disabled>停止</button>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>生成结果</h2>
          <div class="head-actions">
            <button class="btn btn-ghost btn-sm" id="btnCopy">复制</button>
            <button class="btn btn-ghost btn-sm" id="btnDownload">下载 .md</button>
          </div>
        </div>
        <div class="output" id="output"><span class="placeholder">尚未生成内容。</span></div>
        <div class="meta-line" id="metaLine" hidden>
          <span id="metaChars">0 字</span>
          <span class="dot"></span>
          <span id="metaMode">—</span>
          <span class="dot"></span>
          <span id="metaHint">若觉得未写完，点「继续生成」</span>
        </div>
      </section>
    </div>
  </div>

  <!-- 回收站 -->
  <div class="panel" id="panelTrash" hidden>
    <section class="card">
      <div class="card-head">
        <h2>回收站</h2>
        <button class="btn btn-ghost btn-sm" id="btnClearTrash">清空全部</button>
      </div>
      <div class="trash-list" id="trashList"></div>
    </section>
  </div>

  <p class="footer">茉莉人设小助手 · 人物 → 经历 → 记忆 → 性格 → 行为 → 关系 → 选择 → 后果 → 成长</p>
</main>

<script>
/* =========================================================
   一、内置系统指令（原样保留，禁止修改）
   ========================================================= */

const MOLI_PROMPT = `# 【茉莉人设小助手｜CHAR完整人设构建协议】

曾经活过、现在正在生活、未来还会继续变化的人。

function toast(msg, type='ok'){
  const el = document.createElement('div');
  el.className = 'toast ' + (type === 'err' ? 'err' : '');
  el.textContent = (type === 'err' ? '!  ' : '✓  ') + msg;
  $('#toasts').appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateX(12px)';
    setTimeout(() => el.remove(), 240);
  }, 3400);
}

  const dot = $('#statusDot');

  $('#statusText').textContent = text || map[s] || '未连接';
}

function normalizeBase(v){
  let s = (v || '').trim().replace(/\/+$/, '');
  if (/^https?:\/\/[^\/]+$/i.test(s)) s += '/v1';
  return s;
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function countChars(s){
  return (s || '').replace(/\s/g, '').length;
}

function updateMeta(chars){
  const meta = $('#metaLine');
  if (!chars || chars < 5){
    meta.hidden = true;
    return;
  }
  meta.hidden = false;
  $('#metaChars').textContent = chars.toLocaleString() + ' 字';
  $('#metaMode').textContent = MODE_NAMES[state.mode];
}


/* =========================================================
   七、系统提示词构建
   ========================================================= */

function buildSystemPrompt(){
  const parts = [];

  // 1. 基础指令源
  if (state.source === 'builtin'){
    parts.push(MOLI_PROMPT);
  } else if (state.source === 'custom'){
    const c = ($('#customPreset').value || '').trim();
    if (c) parts.push(c);
  }

  // 2. 生成模式附加聚焦指令
  const extra = MODE_EXTRA[state.mode];
  if (extra) parts.push(extra);

  // 3. 文风塑造
  if ($('#chkStyle').checked) parts.push(STYLE_PRESET);

  // 4. 世界书
  if ($('#chkWb').checked) parts.push(WORLDBOOK_PRESET);

  // 5. 强制完整输出协议（永久内置，永远追加在最末，优先级最高）
  parts.push(FULL_OUTPUT_ENFORCER);

  return parts.join('\n\n' + '─'.repeat(48) + '\n\n');
}


/* =========================================================
   八、配置持久化
   ========================================================= */

function saveCfg(){
  localStorage.setItem(LS.base,   $('#baseUrl').value);
  localStorage.setItem(LS.key,    $('#apiKey').value);
  localStorage.setItem(LS.model,  $('#modelSelect').value);
  localStorage.setItem(LS.temp,   $('#temperature').value);
  localStorage.setItem(LS.max,    $('#maxTokens').value);
  localStorage.setItem(LS.stream, $('#streamChk').value);
  localStorage.setItem(LS.style,  $('#chkStyle').checked ? '1' : '0');
  localStorage.setItem(LS.wb,     $('#chkWb').checked ? '1' : '0');
  localStorage.setItem(LS.input,  $('#userInput').value);
  localStorage.setItem(LS.source, state.source);
  localStorage.setItem(LS.mode,   state.mode);
  localStorage.setItem(LS.custom, $('#customPreset').value);
}

function loadCfg(){
  $('#baseUrl').value     = localStorage.getItem(LS.base)  || 'https://api.openai.com/v1';
  $('#apiKey').value      = localStorage.getItem(LS.key)   || '';
  $('#temperature').value = localStorage.getItem(LS.temp)  || '0.9';
  $('#maxTokens').value   = localStorage.getItem(LS.max)   || '8192';
  $('#streamChk').value   = localStorage.getItem(LS.stream)|| '1';
  $('#chkStyle').checked  = (localStorage.getItem(LS.style) ?? '1') === '1';
  $('#chkWb').checked     = (localStorage.getItem(LS.wb)    ?? '1') === '1';
  $('#userInput').value   = localStorage.getItem(LS.input) || '';
  $('#customPreset').value= localStorage.getItem(LS.custom) || '';

  state.source = localStorage.getItem(LS.source) || 'builtin';
  state.mode   = localStorage.getItem(LS.mode)   || 'full';

  document.querySelectorAll('.seg-item').forEach(b => {
    b.classList.toggle('active', b.dataset.src === state.source);
  });
  document.querySelectorAll('.mode-card').forEach(c => {
    c.classList.toggle('active', c.dataset.mode === state.mode);
  });
  $('#customPresetWrap').hidden = state.source !== 'custom';

  try{
    const list = JSON.parse(localStorage.getItem(LS.models) || '[]');
    if (Array.isArray(list) && list.length){
      const sel = $('#modelSelect');
      sel.innerHTML = '';
      list.forEach(id => {
        const o = document.createElement('option');
        o.value = id; o.textContent = id;
        sel.appendChild(o);
      });
      const saved = localStorage.getItem(LS.model);
      if (saved && list.includes(saved)) sel.value = saved;
    }
  }catch(_){}

  if ($('#apiKey').value) setStatus('ok');
}


/* =========================================================
   九、拉取模型
   ========================================================= */

async function fetchModels(){
  const base = normalizeBase($('#baseUrl').value);
  const key  = $('#apiKey').value.trim();

  if (!base) return toast('请先填写 Base URL', 'err');
  if (!key)  return toast('请先填写 API Key', 'err');

  const btn = $('#btnFetchModels');
  btn.disabled = true;
  btn.textContent = '拉取中…';
  setStatus('loading');

  try{
    const res = await fetch(base + '/models', {
      method: 'GET',
      headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' }
    });

    if (!res.ok){
      const t = await res.text().catch(() => '');
      throw new Error('HTTP ' + res.status + (t ? ' · ' + t.slice(0, 160) : ''));
    }

    const data = await res.json();
    const raw  = data.data || data.models || data || [];
    const ids  = raw
      .map(m => (typeof m === 'string' ? m : (m && (m.id || m.name))))
      .filter(Boolean);

    if (!ids.length) throw new Error('返回的模型列表为空');

    ids.sort((a, b) => String(a).localeCompare(String(b)));

    const sel = $('#modelSelect');
    sel.innerHTML = '';
    ids.forEach(id => {
      const o = document.createElement('option');
      o.value = id;
      o.textContent = id;
      sel.appendChild(o);
    });

    const saved = localStorage.getItem(LS.model);
    if (saved && ids.includes(saved)) sel.value = saved;
    else sel.selectedIndex = 0;

    localStorage.setItem(LS.models, JSON.stringify(ids));
    localStorage.setItem(LS.model, sel.value);

    setStatus('ok', ids.length + ' 个模型');
    toast('成功拉取 ' + ids.length + ' 个模型', 'ok');
  }catch(e){
    setStatus('err');
    toast('拉取失败：' + e.message + '（请检查 Base URL / 密钥 / CORS 设置）', 'err');
  }finally{
    btn.disabled = false;
    btn.textContent = '拉取模型';
  }
}


/* =========================================================
   十、回收站
   ========================================================= */

function getTrash(){
  try{ return JSON.parse(localStorage.getItem(LS.trash) || '[]'); }
  catch(_){ return []; }
}
function setTrash(list){
  localStorage.setItem(LS.trash, JSON.stringify(list));
}
function makeTitle(){
  const t = ($('#userInput').value || '').trim().replace(/\s+/g, ' ').slice(0, 36);
  return t || MODE_NAMES[state.mode];
}
function saveToTrash(content){
  const list = getTrash();
  const item = {
    id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    title: makeTitle(),
    modeName: MODE_NAMES[state.mode],
    model: $('#modelSelect').value || '',
    time: Date.now(),
    chars: countChars(content),
    content: content
  };
  list.unshift(item);
  if (list.length > 60) list.length = 60;
  setTrash(list);
  renderTrash();
}

function renderTrash(){
  const list = getTrash();
  const box = $('#trashList');
  const badge = $('#trashBadge');

  badge.textContent = list.length ? String(list.length) : '';

  if (!list.length){
    box.innerHTML = '<div class="trash-empty">回收站为空</div>';
    return;
  }

  box.innerHTML = list.map(it => `
    <div class="trash-item" data-id="${it.id}">
      <div class="trash-head">
        <div class="trash-info">
          <div class="trash-meta">
            <span class="trash-mode">${escapeHTML(it.modeName)}</span>
            <span class="trash-dot"></span>
            <span>${escapeHTML(formatTime(it.time))}</span>
            <span class="trash-dot"></span>
            <span>${(it.chars || 0).toLocaleString()} 字</span>
          </div>
          <div class="trash-title">${escapeHTML(it.title)}</div>
        </div>
        <div class="trash-actions">
          <button class="btn btn-ghost btn-sm" data-act="view">查看</button>
          <button class="btn btn-ghost btn-sm" data-act="restore">恢复到工作台</button>
          <button class="btn btn-ghost btn-sm" data-act="del">删除</button>
        </div>
      </div>
      <div class="trash-body" hidden></div>
    </div>
  `).join('');
}


/* =========================================================
   十一、生成（含继续生成）
   ========================================================= */

let controller = null;
let lastOutput = '';

function setBusy(b){
  $('#btnGenerate').disabled = b;
  $('#btnStop').disabled = !b;
  $('#btnGenerate').textContent = b ? '生成中…' : '生成人设';
  // 继续按钮：生成中禁用；有内容且空闲时启用
  $('#btnContinue').disabled = b || !lastOutput.trim();
}

async function runGeneration(isContinue){
  const base  = normalizeBase($('#baseUrl').value);
  const key   = $('#apiKey').value.trim();
  const model = $('#modelSelect').value;
  const userText = $('#userInput').value.trim();

  if (!base)  return toast('请先填写 Base URL', 'err');
  if (!key)   return toast('请先填写 API Key', 'err');
  if (!model) return toast('请先拉取并选择一个模型', 'err');
  if (!userText) return toast('请先描述你想要的角色', 'err');

  const sys = buildSystemPrompt();
  const messages = [];
  if (sys) messages.push({ role: 'system', content: sys });
  messages.push({ role: 'user', content: userText });

  // 继续生成模式：追加已输出的内容与继续指令
  if (isContinue && lastOutput.trim()){
    messages.push({ role: 'assistant', content: lastOutput });
    messages.push({
      role: 'user',
      content: `继续。从你上次中断的位置继续输出，不要重复任何已经写过的内容，不要重新开始，不要加前言或总结。直接接着往下写。如果上一次的输出在某一段被截断，请从被截断的下一句开始。`
    });
  }

  const useStream = $('#streamChk').value === '1';
  const out = $('#output');

  setBusy(true);
  setStatus('loading');

  // 非继续模式：清空输出。继续模式：保留旧内容，追加新内容
  if (!isContinue){
    lastOutput = '';
    out.textContent = '';
  }

  controller = new AbortController();
  let full = isContinue ? lastOutput : '';

  try{
    const res = await fetch(base + '/chat/completions', {
      method: 'POST',
      signal: controller.signal,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key
      },
      body: JSON.stringify({
        model,
        messages,
        temperature: parseFloat($('#temperature').value) || 0.9,
        max_tokens: parseInt($('#maxTokens').value) || 8192,
        stream: useStream
      })
    });

    if (!res.ok){
      const t = await res.text().catch(() => '');
      throw new Error('HTTP ' + res.status + (t ? ' · ' + t.slice(0, 220) : ''));
    }

    if (!useStream){
      const data = await res.json();
      const piece = data?.choices?.[0]?.message?.content || '';
      if (!piece) throw new Error('返回内容为空');
      full += piece;
      out.textContent = full;
    }else{
      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';
      let gotAny = false;

      while (true){
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const raw of lines){
          const line = raw.trim();
          if (!line || !line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (payload === '[DONE]') continue;

          try{
            const j = JSON.parse(payload);
            const delta =
              j?.choices?.[0]?.delta?.content ??
              j?.choices?.[0]?.message?.content ??
              '';
            if (delta){
              full += delta;
              gotAny = true;
              out.textContent = full;
              out.scrollTop = out.scrollHeight;
            }
          }catch(_){ /* 忽略半包 */ }
        }
      }
      if (!gotAny && !isContinue) out.textContent = '(空回复)';
    }

    lastOutput = full;
    updateMeta(countChars(full));

    // 存入回收站（覆盖式：继续生成时替换最近一条）
    if (full && full.trim()){
      if (isContinue){
        // 覆盖最近一条（同一次会话）
        const list = getTrash();
        if (list.length && Date.now() - list[0].time < 1000 * 60 * 30){
          list[0].content = full;
          list[0].chars = countChars(full);
          list[0].time = Date.now();
          setTrash(list);
          renderTrash();
        }else{
          saveToTrash(full);
        }
      }else{
        saveToTrash(full);
      }
    }

    setStatus('ok', '已连接');
    toast(isContinue ? '已继续生成' : '生成完成 · 已存入回收站', 'ok');
  }catch(e){
    if (e.name === 'AbortError'){
      setStatus('ok', '已连接');
      toast('已停止生成', 'err');
      if (!full) out.innerHTML = '<span class="placeholder">已停止生成。</span>';
      lastOutput = full;
      updateMeta(countChars(full));
      if (full.trim()) saveToTrash(full);
    }else{
      setStatus('err');
      toast('请求失败：' + e.message, 'err');
      out.textContent = full || ('请求失败：' + e.message);
      lastOutput = full;
      updateMeta(countChars(full));
    }
  }finally{
    setBusy(false);
    controller = null;
  }
}


/* =========================================================
   十二、Tab 切换
   ========================================================= */

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === name);
  });
  $('#panelWork').hidden = name !== 'work';
  $('#panelTrash').hidden = name !== 'trash';
  if (name === 'trash') renderTrash();
}


/* =========================================================
   十三、事件绑定
   ========================================================= */

document.addEventListener('DOMContentLoaded', () => {

  loadCfg();
  renderTrash();
  updateMeta(0);

  // 配置变更保存
  ['baseUrl','apiKey','temperature','maxTokens','streamChk'].forEach(id => {
    $('#' + id).addEventListener('change', saveCfg);
  });
  $('#modelSelect').addEventListener('change', saveCfg);
  $('#userInput').addEventListener('input', saveCfg);
  $('#customPreset').addEventListener('input', saveCfg);

  // Tab
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));
  });

  // 生成模式
  document.querySelectorAll('.mode-card').forEach(card => {
    card.addEventListener('click', () => {
      document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      state.mode = card.dataset.mode;
      updateMeta(countChars(lastOutput));
      saveCfg();
    });
  });

  // 指令源
  document.querySelectorAll('.seg-item').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.seg-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.source = btn.dataset.src;
      $('#customPresetWrap').hidden = state.source !== 'custom';
      saveCfg();
    });
  });

  $('#chkStyle').addEventListener('change', saveCfg);
  $('#chkWb').addEventListener('change', saveCfg);

  $('#btnFetchModels').addEventListener('click', fetchModels);

  // 生成 / 继续 / 停止
  $('#btnGenerate').addEventListener('click', () => runGeneration(false));
  $('#btnContinue').addEventListener('click', () => {
    if (!lastOutput.trim()) return toast('暂无可继续的内容', 'err');
    runGeneration(true);
  });
  $('#btnStop').addEventListener('click', () => {
    if (controller) controller.abort();
  });

  // 复制
  $('#btnCopy').addEventListener('click', async () => {
    const text = $('#output').innerText.trim();
    if (!text || text === '尚未生成内容。') return toast('暂无可复制内容', 'err');
    try{
      await navigator.clipboard.writeText(text);
      toast('已复制到剪贴板', 'ok');
    }catch(_){
      toast('复制失败，请手动选择文本', 'err');
    }
  });

  // 下载
  $('#btnDownload').addEventListener('click', () => {
    const text = $('#output').innerText.trim();
    if (!text || text === '尚未生成内容。') return toast('暂无可下载内容', 'err');
    const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'character-profile-' + Date.now() + '.md';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    toast('已下载 .md 文件', 'ok');
  });

  // 清除配置
  $('#btnClearCfg').addEventListener('click', () => {
    if (!confirm('将清除 API 配置、预设、输入与回收站，是否继续？')) return;
    Object.values(LS).forEach(k => localStorage.removeItem(k));
    $('#apiKey').value = '';
    $('#baseUrl').value = 'https://api.openai.com/v1';
    $('#customPreset').value = '';
    $('#userInput').value = '';
    $('#modelSelect').innerHTML = '<option value="">— 请先拉取模型 —</option>';
    state.source = 'builtin';
    state.mode = 'full';
    lastOutput = '';
    $('#output').innerHTML = '<span class="placeholder">尚未生成内容。</span>';
    updateMeta(0);
    document.querySelectorAll('.seg-item').forEach(b => b.classList.toggle('active', b.dataset.src === 'builtin'));
    document.querySelectorAll('.mode-card').forEach(c => c.classList.toggle('active', c.dataset.mode === 'full'));
    $('#customPresetWrap').hidden = true;
    setStatus('');
    renderTrash();
    setBusy(false);
    toast('本地配置已清除', 'ok');
  });

  // 回收站清空
  $('#btnClearTrash').addEventListener('click', () => {
    if (!getTrash().length) return toast('回收站已是空的', 'err');
    if (!confirm('确定清空回收站？此操作不可恢复。')) return;
    setTrash([]);
    renderTrash();
    toast('回收站已清空', 'ok');
  });

  // 回收站事件委托
  $('#trashList').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const item = btn.closest('.trash-item');
    const id = item.dataset.id;
    const act = btn.dataset.act;
    const list = getTrash();
    const rec = list.find(x => x.id === id);

    if (act === 'view'){
      const body = item.querySelector('.trash-body');
      if (!rec) return;
      if (body.hidden){
        body.textContent = rec.content;
        body.hidden = false;
        btn.textContent = '收起';
      }else{
        body.hidden = true;
        btn.textContent = '查看';
      }
    } else if (act === 'restore'){
      if (!rec) return;
      $('#output').textContent = rec.content;
      lastOutput = rec.content;
      updateMeta(countChars(lastOutput));
      setBusy(false);
      switchTab('work');
      toast('已恢复到工作台', 'ok');
    } else if (act === 'del'){
      if (!rec) return;
      if (!confirm('确定删除这条记录？')) return;
      setTrash(list.filter(x => x.id !== id));
      renderTrash();
      toast('已删除', 'ok');
    }
  });

  // 快捷键 Ctrl / Cmd + Enter
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      if (!$('#btnGenerate').disabled) runGeneration(false);
    }
  });
});
</script>
